<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>현대자동차 배터리 전극 생산운영 면접 워크스페이스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --hyundai-blue: #002c5f;
      --hyundai-light-blue: #0072ce;
      --accent-cyan: #00e5ff;
      --accent-teal: #00b4d8;
      --bg-dark: #070d19;
      --sidebar-bg: #091322;
      --card-bg: #0f1c31;
      --card-border: #1c2e4c;
      --card-hover: #162744;
      --text-main: #f0f4fc;
      --text-sub: #94a3b8;
      --star-s: #f59e0b;
      --star-t: #3b82f6;
      --star-a: #10b981;
      --star-r: #8b5cf6;
      --prep-p: #00e5ff;
      --prep-r: #f59e0b;
      --prep-e: #10b981;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* 3-Pane App Layout */
    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ================= 1. LEFT COMPACT SIDEBAR ================= */
    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
      z-index: 70;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--card-border);
      background: #0b172a;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand-logo-badge {
      background: linear-gradient(135deg, #002c5f, #0072ce);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0, 229, 255, 0.35);
      white-space: nowrap;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-top: 2px;
    }

    .brand-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .status-pill {
      color: var(--success);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .status-pill.saving {
      color: var(--star-s);
    }

    /* Sidebar Content: Projects List */
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-proj-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }

    .sidebar-proj-item {
      padding: 9px 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.15s ease;
      text-align: left;
    }

    .sidebar-proj-item:hover {
      background: #11223b;
      color: #ffffff;
      border-color: #1e365c;
    }

    .sidebar-proj-item.active {
      background: linear-gradient(135deg, rgba(0, 114, 206, 0.25) 0%, rgba(15, 28, 49, 0.9) 100%);
      color: #ffffff;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.18);
    }

    .sidebar-proj-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .sidebar-code-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0d1e38;
      color: #38bdf8;
      border: 1px solid #1c3d6e;
      flex-shrink: 0;
    }

    .sidebar-proj-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12.5px;
      font-weight: 600;
    }

    .sidebar-q-count {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .sidebar-proj-item.active .sidebar-q-count {
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.15);
    }

    .sidebar-item-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .sidebar-item-del-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      color: #94a3b8;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .sidebar-proj-item:hover .sidebar-item-del-btn {
      opacity: 0.65;
    }

    .sidebar-item-del-btn:hover {
      opacity: 1 !important;
      background: rgba(239, 68, 68, 0.2);
      transform: scale(1.15);
    }

    @media (hover: none) {
      .sidebar-item-del-btn {
        opacity: 0.65;
      }
    }

    /* Sidebar Footer Tools */
    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--card-border);
      background: #070e1a;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background: #101e33;
      color: var(--text-sub);
      border: 1px solid #1c3254;
      transition: all 0.15s ease;
    }
    .sidebar-btn:hover {
      background: #172d4d;
      color: #ffffff;
      border-color: #2a4c80;
    }
    .sidebar-btn.active-mode {
      background: #0072ce;
      color: #ffffff;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 114, 206, 0.4);
    }

    /* ================= 2. CENTER MAIN WORKSPACE ================= */
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      background: var(--bg-dark);
      position: relative;
    }

    .workspace-top-bar {
      background: #0a1527;
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .proj-title-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 650px;
    }

    .proj-code-tag {
      background: #002c5f;
      color: var(--accent-cyan);
      border: 1px solid #005691;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    .proj-title-input {
      flex: 1;
      background: #070e1c;
      border: 1px solid #1c355c;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .proj-title-input:focus {
      border-color: var(--accent-cyan);
      background: #0a162b;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      user-select: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0072ce 0%, #00529b 100%);
      color: white;
      border-color: #00a0e9;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0084f0 0%, #0060b5 100%);
      box-shadow: 0 0 10px rgba(0, 114, 206, 0.4);
    }
    .btn-outline {
      background: #112035;
      color: var(--text-sub);
      border-color: #243b5e;
    }
    .btn-outline:hover {
      color: white;
      border-color: var(--accent-cyan);
      background: #172a45;
    }
    .btn-danger-outline {
      background: #181c2b;
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-danger-outline:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 11.5px;
    }

    /* Workspace Content Container */
    .workspace-content {
      padding: 22px 28px 40px;
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* Tech Stack Tags Bar */
    .tech-tags-bar {
      background: #0a1424;
      border: 1px solid #162a47;
      border-radius: 10px;
      padding: 8px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tags-label {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .tech-chip {
      background: #13243d;
      color: #93c5fd;
      border: 1px solid #23426e;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tech-chip-del {
      cursor: pointer;
      color: #ef4444;
      font-weight: bold;
    }
    .btn-add-tech {
      background: transparent;
      color: var(--accent-teal);
      border: 1px dashed #24416d;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-add-tech:hover {
      border-color: var(--accent-teal);
      background: rgba(0, 180, 216, 0.1);
    }

    /* ================= QUESTION STEPPER & TABS ================= */
    .q-stepper-container {
      background: #0d1b30;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .q-stepper-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
    }

    .q-tab-btn {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      background: #11223b;
      border: 1px solid #1c345a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .q-tab-btn:hover {
      background: #172f52;
      color: #ffffff;
      border-color: #2b4f85;
    }
    .q-tab-btn.active {
      background: linear-gradient(135deg, #0072ce 0%, #00458a 100%);
      color: #ffffff;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }
    .q-tab-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
    }

    .q-stepper-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-toggle-btn {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      background: #091322;
      border: 1px solid #1c3254;
      cursor: pointer;
    }
    .view-toggle-btn.active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    /* ================= QUESTION CARD ================= */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      animation: fadeInCard 0.25s ease;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .q-card-header {
      background: #112038;
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .q-title-input {
      flex: 1;
      background: #070e1a;
      border: 1px solid #1a3154;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      outline: none;
      min-width: 260px;
    }
    .q-title-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
    }

    .q-card-body {
      padding: 20px 22px;
    }

    /* One-Line Lead Summary */
    .summary-lead-box {
      background: linear-gradient(135deg, rgba(0, 114, 206, 0.15) 0%, rgba(13, 30, 56, 0.5) 100%);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .summary-lead-badge {
      background: linear-gradient(135deg, #0072ce 0%, #00458a 100%);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid rgba(0, 229, 255, 0.35);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .summary-lead-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14.5px;
      font-weight: 600;
      color: #f0fdf4;
      line-height: 1.6;
      font-family: inherit;
      resize: none;
      overflow-y: hidden;
      word-break: keep-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      field-sizing: content;
      min-height: 26px;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .summary-lead-input::placeholder {
      color: #64748b;
      font-style: italic;
    }
    body.theme-skhynix .summary-lead-box {
      background: linear-gradient(135deg, rgba(235, 16, 36, 0.12) 0%, rgba(30, 12, 16, 0.5) 100%);
      border-color: rgba(255, 122, 0, 0.3);
      border-left-color: #ff7a00;
    }
    body.theme-skhynix .summary-lead-badge {
      background: linear-gradient(135deg, #eb1024 0%, #b30012 100%);
      border-color: rgba(255, 122, 0, 0.4);
    }

    /* ================= STEP ANSWER ROWS (STAR) ================= */
    .step-card {
      background: #091322;
      border: 1px solid #1a2d4b;
      border-radius: 10px;
      margin-bottom: 14px;
      padding: 12px 14px;
      transition: border-color 0.2s;
    }
    .step-card:hover {
      border-color: #26436f;
    }

    .step-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .step-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-s { background: rgba(245, 158, 11, 0.2); color: var(--star-s); border: 1px solid var(--star-s); }
    .badge-t { background: rgba(59, 130, 246, 0.2); color: var(--star-t); border: 1px solid var(--star-t); }
    .badge-a { background: rgba(16, 185, 129, 0.2); color: var(--star-a); border: 1px solid var(--star-a); }
    .badge-r { background: rgba(139, 92, 246, 0.2); color: var(--star-r); border: 1px solid var(--star-r); }
    .badge-c { background: rgba(0, 229, 255, 0.2); color: #00e5ff; border: 1px solid #00e5ff; }
    body.theme-skhynix .badge-c { background: rgba(255, 122, 0, 0.2); color: #ff7a00; border: 1px solid #ff7a00; }
    
    .badge-p { background: rgba(0, 229, 255, 0.2); color: var(--prep-p); border: 1px solid var(--prep-p); }
    .badge-reason { background: rgba(245, 158, 11, 0.2); color: var(--prep-r); border: 1px solid var(--prep-r); }
    .badge-e { background: rgba(16, 185, 129, 0.2); color: var(--prep-e); border: 1px solid var(--prep-e); }
    
    .badge-mece-c { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }
    .badge-mece-1 { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
    .badge-mece-2 { background: rgba(192, 132, 252, 0.2); color: #c084fc; border: 1px solid #c084fc; }
    .badge-mece-s { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid #34d399; }

    .step-title-desc {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .step-sub-hint {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    /* 1. KEYWORD INPUT (Directly in front of sentence!) */
    .step-kw-container {
      background: #0b182b;
      border: 1px solid #1e385e;
      border-radius: 7px;
      padding: 6px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-kw-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-cyan);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.2px;
    }
    .step-kw-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 13.5px;
      font-weight: 700;
      color: #38bdf8;
      font-family: 'Pretendard', sans-serif;
    }
    .step-kw-input::placeholder {
      color: #475569;
      font-weight: 500;
      font-size: 12.5px;
    }

    /* 2. FULL ANSWER SENTENCE */
    .step-full-container {
      position: relative;
    }
    .step-full-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .step-full-box {
      background: #0e1b30;
      border: 1px solid #182c49;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13.5px;
      color: #e2e8f0;
      line-height: 1.7;
      min-height: 48px;
      outline: none;
      transition: all 0.2s;
    }
    .step-full-box:focus {
      background: #11223d;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
    }
    .step-full-box:empty:before {
      content: attr(placeholder);
      color: #475569;
    }

    /* ================= QUESTION BOTTOM NAV BUTTONS ================= */
    .q-bottom-nav {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #162842;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .q-nav-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .q-page-indicator {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .q-dots-list {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .q-dot-pill {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1c3254;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-dot-pill:hover {
      background: #38bdf8;
    }
    .q-dot-pill.active {
      width: 22px;
      border-radius: 10px;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    }

    /* ================= 3. RIGHT REFERENCE PANE ================= */
    .reference-pane {
      width: 380px;
      flex-shrink: 0;
      background: #091322;
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      transition: width 0.25s ease;
      z-index: 60;
    }
    .reference-pane.collapsed {
      width: 0;
      border-left: none;
    }

    .ref-header {
      padding: 14px 18px;
      background: #0c182b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ref-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .doc-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      background: #0a1424;
      border-bottom: 1px solid var(--card-border);
    }
    .doc-tab {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      background: #112035;
      border: 1px solid var(--card-border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .doc-tab:hover {
      color: white;
      background: #162a47;
    }
    .doc-tab.active {
      background: #0f1c31;
      color: var(--accent-cyan);
      border-top: 2px solid var(--accent-cyan);
    }

    .ref-search-bar {
      padding: 10px 16px;
      background: #0a1424;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ref-search-input {
      flex: 1;
      background: #060c18;
      border: 1px solid #1a3154;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .ref-search-input:focus {
      border-color: var(--accent-cyan);
    }

    .ref-cat-filters {
      display: flex;
      gap: 5px;
      padding: 8px 16px;
      background: #091322;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      align-items: center;
    }
    .ref-cat-chip {
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #1c3254;
      background: #0f1c31;
      color: var(--text-sub);
      white-space: nowrap;
    }
    .ref-cat-chip.active[data-cat="all"] { background: #0072ce; color: white; border-color: var(--accent-cyan); }
    .ref-cat-chip.active[data-cat="career"] { background: #0284c7; color: white; border-color: #38bdf8; }
    .ref-cat-chip.active[data-cat="project"] { background: #7c3aed; color: white; border-color: #c084fc; }
    .ref-cat-chip.active[data-cat="essay"] { background: #d97706; color: white; border-color: #fbbf24; }

    .ref-content-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }

    .doc-chunk-card {
      background: #0f1c31;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 12px;
      position: relative;
    }
    .doc-chunk-card.cat-career { border-left: 3px solid #0284c7 !important; }
    .doc-chunk-card.cat-project { border-left: 3px solid #8b5cf6 !important; }
    .doc-chunk-card.cat-essay { border-left: 3px solid #f59e0b !important; }

    .chunk-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #162842;
    }
    .chunk-tag {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent-teal);
    }
    .chunk-copy-btn {
      background: #142742;
      color: #90cdf4;
      border: 1px solid #23426e;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      cursor: pointer;
    }
    .chunk-copy-btn:hover {
      background: var(--hyundai-light-blue);
      color: white;
    }
    .chunk-text {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .highlight {
      background-color: rgba(245, 158, 11, 0.4);
      color: #fff;
      font-weight: bold;
      border-radius: 2px;
    }

    /* ================= TRAINING MODES ================= */
    /* 1. KEYWORDS ONLY TRAINING MODE (Blur full answer) */
    .keywords-only-mode .step-full-box,
    .keywords-only-mode .plain-full-box,
    .keywords-only-mode .unified-full-box {
      filter: blur(8px);
      opacity: 0.25;
      user-select: none;
      transition: filter 0.2s, opacity 0.2s;
    }
    .keywords-only-mode .step-full-box:hover,
    .keywords-only-mode .step-full-box:focus,
    .keywords-only-mode .plain-full-box:hover,
    .keywords-only-mode .plain-full-box:focus,
    .keywords-only-mode .unified-full-box:hover,
    .keywords-only-mode .unified-full-box:focus {
      filter: blur(0);
      opacity: 1;
      user-select: auto;
    }
    .keywords-only-mode .step-kw-container,
    .keywords-only-mode .plain-kw-row,
    .keywords-only-mode .star-kw-row {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
    }
    body.theme-skhynix .keywords-only-mode .star-kw-row {
      border-color: #ff7a00;
      box-shadow: 0 0 8px rgba(234, 0, 41, 0.25);
    }

    /* 2. BLIND SIMULATION MODE (Blur both keywords and answers) */
    .blind-mode .step-kw-container,
    .blind-mode .step-full-box,
    .blind-mode .plain-answer-card,
    .blind-mode .summary-lead-box,
    .blind-mode .star-kw-row,
    .blind-mode .unified-full-box {
      filter: blur(9px);
      user-select: none;
      transition: filter 0.2s;
    }
    .blind-mode .step-kw-container:hover,
    .blind-mode .step-full-box:hover,
    .blind-mode .plain-answer-card:hover,
    .blind-mode .summary-lead-box:hover,
    .blind-mode .star-kw-row:hover,
    .blind-mode .unified-full-box:hover {
      filter: blur(0);
      user-select: auto;
    }

    /* Lock Screen Overlay */
    #lockScreenOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0f2347 0%, #060c18 100%);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #lockScreenOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .lock-card {
      background: #0d1a2d;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 114, 206, 0.2);
    }
    .lock-icon-wrap {
      width: 64px;
      height: 64px;
      background: rgba(0, 114, 206, 0.2);
      border: 1px solid var(--accent-cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }
    .lock-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .lock-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .lock-input {
      width: 100%;
      background: #070d19;
      border: 1px solid #1e3352;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      color: #ffffff;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .lock-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }
    .lock-input.shake {
      animation: shakeAnim 0.4s ease;
      border-color: #ef4444;
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .lock-submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0072ce 0%, #00458a 100%);
      color: white;
      border: 1px solid var(--accent-cyan);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lock-submit-btn:hover {
      background: linear-gradient(135deg, #0088f5 0%, #0054a8 100%);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
    }
    .lock-error-msg {
      font-size: 12px;
      color: #f87171;
      margin-top: 10px;
      min-height: 18px;
    }
    .lock-hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 16px;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #002c5f;
      color: #00e5ff;
      border: 1px solid #00a0e9;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 99999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }


    /* ================= COMPANY MODE TOGGLE & THEMES ================= */
    .company-toggle-container {
      display: flex;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 9px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 12px;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35);
    }

    .company-toggle-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .company-toggle-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .company-toggle-btn.active.mode-hyundai {
      background: linear-gradient(135deg, #002c5f 0%, #0072ce 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(0, 114, 206, 0.45);
      border-color: rgba(0, 229, 255, 0.45);
    }

    .company-toggle-btn.active.mode-skhynix {
      background: linear-gradient(135deg, #b90014 0%, #ea0029 60%, #ff6b00 100%);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(234, 0, 41, 0.55);
      border-color: rgba(255, 107, 0, 0.5);
    }

    .company-toggle-icon {
      font-size: 13px;
      line-height: 1;
    }

    /* SK HYNIX THEME OVERRIDES */

      --hyundai-light-blue: #ea0029;
      --accent-cyan: #ff7a00;

      --sidebar-bg: #14080b;
      --card-bg: #1c0d12;
      --card-border: #3b1720;
      --card-hover: #291219;
      --prep-p: #ff7a00;
      --star-t: #f97316;
    }

      background: linear-gradient(135deg, #b90014, #ea0029, #ff7a00);
      border-color: rgba(255, 122, 0, 0.45);
      box-shadow: 0 0 10px rgba(234, 0, 41, 0.35);
    }

    body.theme-skhynix .sidebar-header {
      background: #19090e;
    }

    body.theme-skhynix .sidebar-proj-item.active {
      border-color: rgba(234, 0, 41, 0.6);

    }

    body.theme-skhynix .btn-primary {
      background: linear-gradient(135deg, #b90014, #ea0029);
      border-color: #ff7a00;
    }
    body.theme-skhynix .btn-primary:hover {
      background: #ff2a4b;
    }

    body.theme-skhynix .top-bar-badge {
      background: rgba(234, 0, 41, 0.2);
      color: #ff7a00;
      border-color: rgba(255, 122, 0, 0.35);
    }

    body.theme-skhynix .q-num-badge {
      background: linear-gradient(135deg, #ea0029, #ff7a00);
      box-shadow: 0 2px 8px rgba(234, 0, 41, 0.4);

    body.theme-skhynix .doc-tab.active {

    /* Scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #070d19; }
    ::-webkit-scrollbar-thumb { background: #1a2f4c; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #294775; }

    body.theme-skhynix ::-webkit-scrollbar-track { background: #14080b; }
    body.theme-skhynix ::-webkit-scrollbar-thumb { background: #3b1720; }
    body.theme-skhynix ::-webkit-scrollbar-thumb:hover { background: #5c202e; }

    /* ================= SIMPLIFIED Q-CARD & STAR TOGGLE ================= */
    .q-badge-num {
      background: linear-gradient(135deg, var(--hyundai-light-blue), var(--accent-cyan));
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 114, 206, 0.4);
      flex-shrink: 0;
    }
    body.theme-skhynix .q-badge-num {
      background: linear-gradient(135deg, #ea0029, #ff7a00);
      box-shadow: 0 2px 8px rgba(234, 0, 41, 0.4);
    }

    .answer-section {
      margin-top: 14px;

      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 9px 12px 9px 12px;
      margin-bottom: 12px;
    }

      background: #15080c;
      border-color: #3b1720;
    }

    .plain-answer-header-label {
      display: flex;

      align-items: center;

      background: #0e0508;

    { tag: "프로젝트 6: 이미지 처리 엔진 개발", text: "이미지 처리 엔진 개발\n[이슈] 공정 불량 발생에 따른 출하 지연 (100만 이미지 육안 전수 선별 필요)\n[경험] 룰 기반 적응형 컴퓨터 비전 엔진 자체 개발을 통한 긴급 출하 대응 (100만 장 전수 자동 선별 프로그램 구현)\n[성과] 100만 장 전수 선별 완료 (장당 5ms 초고속 처리), 미검률 0% 달성 및 출하 지연 0건\n[역할] 이미지 처리 알고리즘 수학적 모델링 및 자동 선별 프로그램 단독 개발\n[기술] 이미지처리 관련 비전 지식" },
    { tag: "자소서 1번: 차별화 직무 강점 (비전 엔진)", text: "1)본인만의 차별화된 직무 강점과 이를 통해 당사에 기여할 수 있는 점에 대해 기술해 주세요.(1000자)\n■[이미지 처리 엔진 개발 : 불량 선별 긴급출하 대응]\nAI를 활용하여 고객을 대응하고,NG선별 프로그램을 개발하고 유관부서와 협의를 통해 출하지연을 막은 경험이 있습니다. '실오라기 형태의 Burr' 이슈가 발생하여 출하가 지연됐는데, 출하량 감소를 막기 위해 불량 선별이 필요했습니다. 육안 확인이 필요한 사진은 100만장에 육박했고, 그 중 Burr는 0.5% 수치였습니다. 저는 사람이 음영차이로 구분할 수 있다면, AI를 활용해 픽셀, 그레이스케일로 구분할 수 있다고 생각했습니다. 현장 엔지니어의 도메인 지식과 컴퓨터 비전을 활용하여 '이미지 처리 엔진'을 자체 개발해 72시간 내에 100만 장을 오차 없이 선별하겠다는 과제를 설정했습니다.\n먼저 사람이 육안 선별한 표준 샘플의 그레이스케일을 심층 분석하여, 불량의 본질이 전극 경계면에는 '국소 음영 낙차'가 존재하고 골짜기처럼 Th값이 있음을 확인했습니다. \n1. 초기에는 단일 Th값을 적용했으나, Lot 간 조명 및 코팅 농도 편차로 인해 과검과 미검이 발생했습니다. 이를 위해 배경 코팅의 평균 스케일을 실시간 추정하여 55를 기준으로 레시피를 2개로 자동 전환하는 '이원화 Valley 알고리즘'을 구축했습니다. 절대 밝기가 아닌 상대적 음영 낙차를 계산함으로써 랏간 편차를 상쇄했습니다.\n2. Burr불량은 연속된 직선이 아니라 중간이 끊어지며 지그재그로 파이는 특성이 있어, 단순 컨투어 검출 시 단절된 미세 노이즈로 오인되는 문제가 발생했습니다. 저는 결함의 기하학적 연속성을 복원하기 위해 1×7 수직 Bridge Kernel를 직접 설계하고, 수직 모폴로지 닫힘연산을 적용했습니다. 이를 통해 단절된 미세 균열 신호를 하나의 연속된 결함 다각형으로 연결한 뒤, 8-연결성 성분분석을 거쳐 20px 이상의 치명 결함만 정확히 포착해 냈습니다.\n그 결과 장당 평균 5ms 속도로 완수하며 이슈를 클로징 했습니다. 이를 기반으로 문제의 물리적 본질을 Data와 수학적 알고리즘으로 모델링하겠습니다." },
    { tag: "자소서 2번: 주요 프로젝트 및 성과 (Shim 전동화 & 웹게이지)", text: "2) 수행했던 주요 프로젝트의 내용 및 성과를 기재하고, 지원자분께서 맡았던 역할에 대하여 서술해 주세요. (1000자)\n생산운영 엔지니어의 필요역량은 '양산을 위한 설비/공법 개발 경험' 입니다. 새로운 제품을 생산하기 위해서는 새로운 설비/공법이 필요하기 때문에 이를 현장의 눈높이에 맞게끔 신규개발하므로써 작업자 숙련도에 따른 공정산포를 제거하여 자동화에 기여해야 합니다. 저는 아래의 장비개조 경험을 통해 작업자 숙련도에 따른 공정 산포를 완벽히 제거하고 양산을 안정화시킬 수 있었습니다.\n\n■[신규 기술 개발로 수율 0.2% 개선]\n신규 New-form factor 전극 biz에서 신규격 제품 생산을 위해 장비를 세팅하는 신규 기술이 필요했고, 저는 Loss를 최소화하기 위해 신규 기술을 개발하는 업무를 담당했습니다. 고객이 제시한 타이트한 누적공차 spec과 공정능력을 만족시켜야 하는 공정 특성상, 수동 offset 조정으로 인한 미세한 편차가 초기 양산 수율을 떨어드리고 Loss를 유발하는 핵심 병목이었습니다. 공정 엔지니어로서 이러한 설비적 변동성을 통제하기 위해 미세조절장치의 전면적인 디지털화 기술 도입을 추진했습니다. 수동조작을 대체하기 위해 고감속비의 웜기어와 소형 모터를 결합했고 기계적인 백래시를 최소화하면서 직진 운동으로 변환하는 메커니즘을 설계했습니다. 특히, 설정값과 실제 이동값의 오차를 잡기 위해 ㎛ 단위의 미세 변위를 실시간으로 측정하는 고분해능 LVDT 센서를 부착, 실시간 위치 피드백을 통해 목표한 타겟값에 정확히 안착할 수 있는 정량적 제어 시스템을 구축했습니다.\n그 결과, 장비 개조를 통해 작업자 숙련도에 따른 공정 산포를 완벽히 제거하고 재현성을 확보했습니다. 타겟 두께 및 폭 스펙에 도달하는 시간을 대폭 단축하여 Loss를 18% 개선하였고, 수율 0.2%를 개선했습니다.\n\n이 뿐만 아니라 비전 검사기에 잡히지않는 신규 로직을 개발하여 수율 0.12%, 해당 항목의 Loss를 50% 개선하였습니다.공정의 Ref 데이터를 분석하여 이동평균을 적용하고 Noise 제거를 위해 Logic을 설계한 경험을 기반으로 수율 향상에 기여하겠습니다." }

    { tag: "자소서 2번: AI 활용 문제 해결 (2000자 원문 전체)", text: "2) AI를 활용한 프로젝트/공모전/논문/연구/문제 해결 경험 등을 작성해 주세요. *(2000자)\n■[이미지 처리 엔진 개발 : 불량 선별 긴급출하 대응]\n AI를 활용하여 고객을 대응하고,NG선별 프로그램을 개발하고 유관부서와 협의를 통해 출하지연을 막은 경험이 있습니다. '실오라기 형태의 Burr' 이슈가 발생하여 출하가 지연됐는데, 출하량 감소를 막기 위해 불량 선별이 필요했습니다. 육안 확인이 필요한 사진은 100만장에 육박했고, 그 중 Burr는 0.5% 수치였습니다. 저는 사람이 음영차이로 구분할 수 있다면, AI를 활용해 픽셀과 그레이스케일로 구분할 수 있다고 생각했습니다. 현장 엔지니어의 도메인 지식과 컴퓨터 비전을 활용하여 '이미지 처리 엔진'을 자체 개발해 72시간 내에 100만 장을 오차 없이 선별하겠다는 과제를 설정했습니다.\n 먼저 사람이 육안 선별한 표준 샘플의 그레이스케일을 심층 분석하여, 불량의 본질이 전극 경계면에는 '국소 음영 낙차'가 존재하고 골짜기처럼 Th값이 있음을 확인했습니다. \n 1. 랏별 밝기 편차로 인한 오검출 \n초기에는 단일 Th값을 적용했으나, Lot 간 조명 및 코팅 농도 편차로 인해 과검과 미검이 발생했습니다. 이를 위해 배경 코팅의 평균 스케일을 실시간 추정하여 55를 기준으로 레시피를 2개로 자동 전환하는 '이원화 Valley 알고리즘'을 구축했습니다. 절대 밝기가 아닌 배경 대비 상대적 음영 낙차를 계산함으로써 랏간 편차를 상쇄했습니다.\n2.  미세 불연속 크랙의 신호 소실 극복 (수직 모폴로지 닫힘 연산)\nBurr불량은 연속된 직선이 아니라 중간이 끊어지며 지그재그로 파이는 특성이 있어, 단순 컨투어 검출 시 단절된 미세 노이즈로 오인되는 문제가 발생했습니다. 저는 결함의 기하학적 연속성을 복원하기 위해 1×7 수직 Bridge Kernel를 직접 설계하고, 수직 모폴로지 닫힘연산을 적용했습니다. 이를 통해 단절된 미세 균열 신호를 하나의 연속된 결함 다각형으로 연결한 뒤, 8-연결성 성분분석을 거쳐 20px 이상의 치명 결함만 정확히 포착해 냈습니다.\n3. 공정상 노이즈 배제 \n전극 Tape 부착부를 불량으로 오인하지 않도록 적응형 테이프 검출 알고리즘을 적용하여 검사 제외 영역으로 자동 마스킹했습니다. 또한 PyQt5 기반 GUI를 개발하여 결함 부위를 붉은색 바운딩 박스로 즉시 확대 검증할 수 있도록 했습니다.\n  그 결과, 100만 장의 이미지 선별을 장당 평균 5ms 속도로 완수하며 이슈를 클로징했습니다. 이 경험을 통해 문제의 물리적 본질을 Data와 수학적 알고리즘으로 모델링하겠습니다.\n\n■[팀의 AI 대신맨]\n 저는 AI를 활용하여 팀의 반복 업무를 대폭 줄여 공수를 100% 줄인 경험이 있습니다. 저는 '신규 biz를 위한 양산 시스템 구축' 프로젝트를 통해 고객과 직접 기술 커뮤니케이션해야하는 제품 양산을 담당하게 되어 개발빌드에 공정 담당자로 참여했습니다. 당시 고객은 모든 Lot에 대한 검사기 Data를 요청하였는데, 사내의 여러 시스템과 헌팅 Data를 제거해야 해서 엔지니어가 일 2시간을 수작업으로 Data를 다운받고, 발라냈었습니다. 저는 '고객향 Data 송부 100% 자동화'를 목표로 AI기술을 활용하여 단독 개발을 착수했습니다. \n 우선 수작업을 메뉴얼화하고 이를 기반으로 PRD를 작성했습니다. 시스템에서 검사기 Data를 다운받고, 공정 특성상 헌팅개소를 제거한 뒤 공정능력을 포함한 그래프로 일일 생산량에 대한 검사기 데이터를 모니터링하는 것이 그 순서였습니다. 저 사내 보안 제약으로 직접적인 시스템 연동이 어려운 점을 극복하기 위해 파이썬 기반의 RPA 기술을 도입했습니다. 엔지니어의 마우스 클릭과 화면 이동 경로를 좌표화하여 IoT 시스템에서 Data를 자동으로 다운하는 스크립트를 구현했습니다. 그리고 룰베이스 기반의 헌팅개소를 제거하는 로직을 기반으로,그래프를 Plot하고 일일 대쉬보드를 바로 확인할 수 있도록 HTML로 구현했습니다. 나아가 코딩 지식이 없는 팀원도 쉽게 사용할 수 있도록 직관적인 GUI환경을 구축해 배포했습니다.\n 위의 경험을 활용하여, AI를 활용하여 공정 개선업무 수행에 기여하겠습니다." }

function getActiveDefaultProjects() {

}

function switchCompanyMode(mode, userInitiated = true) {
  if (mode !== 'hyundai' && mode !== 'skhynix') {
    mode = 'hyundai';
  }

  // Save current projects before switching
  if (projectsData && projectsData.length > 0) {
    saveProjectsData();
  }

  currentCompanyMode = mode;
  const config = getActiveCompanyConfig();

  // Persist mode in localStorage
  try {
    localStorage.setItem('CURRENT_COMPANY_MODE', mode);
  } catch (e) {}

  // Sync URL query parameter without full reload
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('mode', mode);
    window.history.replaceState({}, '', url.toString());
  } catch (e) {}

  // Update Toggle Button styles
  const btnHmc = document.getElementById('modeBtnHyundai');
  const btnSkh = document.getElementById('modeBtnSkhynix');
  if (btnHmc) btnHmc.classList.toggle('active', mode === 'hyundai');
  if (btnSkh) btnSkh.classList.toggle('active', mode === 'skhynix');

  // Update Theme Class on Body
  document.body.className = (mode === 'skhynix') ? 'theme-skhynix' : 'theme-hyundai';

  // Update Brand Text
  const badgeEl = document.getElementById('brandLogoBadge');
  if (badgeEl) badgeEl.textContent = config.badge;

  const titleEl = document.getElementById('brandTitle');
  if (titleEl) titleEl.textContent = config.title;

  const subEl = document.getElementById('brandSub');
  if (subEl) subEl.textContent = config.sub;

  const lockTitleEl = document.getElementById('lockTitle');
  if (lockTitleEl) lockTitleEl.textContent = config.lockTitle;

  document.title = config.pageTitle;

  // Reload projects data for the target company
  currentProjIndex = 0;
  loadProjectsData();

  // Auto-switch reference doc tab to matching company
  switchDocTab(config.docKey);

  // Re-render UI
  renderSidebar();
  renderCurrentProject();

  if (userInitiated) {
    showToast(mode === 'skhynix' ? '🔴 SK하이닉스 양산기술 모드로 전환되었습니다.' : '🚗 현대자동차 배터리 생산운영 모드로 전환되었습니다.');
  }
}

function formatCodeBadge(code, fallbackIdx) {
  if (!code) {
    const n = (fallbackIdx !== undefined) ? fallbackIdx + 1 : 1;
    return n < 10 ? `0${n}` : `${n}`;
  }
  const match = String(code).match(/\d+/);
  if (match) {
    const n = parseInt(match[0], 10);
    return n < 10 ? `0${n}` : `${n}`;
  }
  return String(code).trim();
}

function ensurePlainText(q) {
  if (q.plain_text && q.plain_text.trim().length > 0) return q.plain_text;
  const parts = [];
  if (q.s) parts.push(`[S] ${q.s}`);
  if (q.t) parts.push(`[T] ${q.t}`);
  if (q.a) parts.push(`[A] ${q.a}`);
  if (q.r) parts.push(`[R] ${q.r}`);
  if (q.c) parts.push(`[C] ${q.c}`);
  if (q.p1) parts.push(`[결론] ${q.p1}`);
  if (q.e) parts.push(`[사례] ${q.e}`);
  if (q.p2) parts.push(`[기여] ${q.p2}`);
  const res = parts.join('\n\n');
  q.plain_text = res;
  return res;
}

function ensurePlainKeywords(q) {
  if (q.plain_kw && q.plain_kw.trim().length > 0) return q.plain_kw;
  const kws = [q.s_kw, q.t_kw, q.a_kw, q.r_kw, q.c_kw, q.p1_kw, q.p2_kw, q.e_kw].filter(Boolean);
  const res = kws.join(' | ');
  q.plain_kw = res;
  return res;
}

function loadProjectsData() {
  const config = getActiveCompanyConfig();
  const defaultList = getActiveDefaultProjects();

  loadCategoriesData();

  // Version flag to seamlessly update user's localStorage to authentic cover letter texts with [S][T][A][R][C] & single-word keywords
  const DATA_VER_KEY = 'INTERVIEW_DASH_DATA_VER_2026_09_27_V4';
  if (localStorage.getItem(DATA_VER_KEY) !== 'true') {
    localStorage.removeItem('INTERVIEW_DASH_DATA_HYUNDAI');
    localStorage.removeItem('INTERVIEW_DASH_DATA_SKHYNIX');
    localStorage.removeItem('HYUNDAI_INTERVIEW_DASHBOARD_DATA_2026');
    localStorage.setItem(DATA_VER_KEY, 'true');
  }

  let saved = localStorage.getItem(config.storageKey);

  // Seamless backward-compatibility migration for Hyundai data
  if (!saved && currentCompanyMode === 'hyundai') {
    saved = localStorage.getItem('HYUNDAI_INTERVIEW_DASHBOARD_DATA_2026');
    if (saved) {
      localStorage.setItem(config.storageKey, saved);
    }
  }

  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      // Ensure it's a non-empty array
      if (Array.isArray(parsed) && parsed.length > 0) {
        projectsData = parsed;
        // Migrate / ensure category & questions integrity
        projectsData.forEach((proj, pIdx) => {
          if (!proj.category) {
            if (proj.id === 'C1' || proj.id === 'C2' || proj.id === 'P5' || (proj.code && proj.code.startsWith('C')) || (proj.title && (proj.title.includes('셋업') || proj.title.includes('운영')))) {
              proj.category = 'career';
              if (!proj.code || proj.code.startsWith('PROJECT 05')) proj.code = 'CAREER 02';
            } else {
              proj.category = 'project';
            }
          }

          // Ensure category exists in categoriesData
          if (!categoriesData.some(c => c.id === proj.category)) {
            categoriesData.push({ id: proj.category, name: proj.category, icon: '📁' });
          }

          if (!proj.questions) proj.questions = [];
          proj.questions.forEach((q) => {
            if (q.use_star === undefined) q.use_star = false; // Default clean plain text
            if (!q.plain_text) ensurePlainText(q);
            if (!q.plain_kw) ensurePlainKeywords(q);
          });
        });
      } else {
        projectsData = JSON.parse(JSON.stringify(defaultList));
      }
    } catch (e) {
      console.error("Failed to parse saved data, fallback to default", e);
      projectsData = JSON.parse(JSON.stringify(defaultList));
    }
  } else {
    projectsData = JSON.parse(JSON.stringify(defaultList));
  }

  // Double check: if projectsData is somehow empty, fill with defaultList
  if (!projectsData || projectsData.length === 0) {
    projectsData = JSON.parse(JSON.stringify(defaultList));
  }

  // Initialize active question index
  projectsData.forEach((_, idx) => {
    if (activeQuestionIndex[idx] === undefined) activeQuestionIndex[idx] = 0;
  });
}

function saveProjectsData() {
  const config = getActiveCompanyConfig();
  setSaveStatus("저장 중...", true);

  if (currentCompanyMode === 'hyundai') {
    localStorage.setItem('HYUNDAI_INTERVIEW_DASHBOARD_DATA_2026', jsonStr);
  }

  setTimeout(() => {
    setSaveStatus("● 실시간 자동 저장", false);
  }, 250);
}

function triggerAutoSave() {

  }, 400);
}

function editCategoryPrompt(catId) {
  const cat = categoriesData.find(c => c.id === catId);
  if (!cat) return;
  const newName = prompt(`'${cat.name}' 분류 이름을 수정하세요:`, cat.name);
  if (newName && newName.trim()) {
    cat.name = newName.trim();
    const newIcon = prompt(`이모지를 수정하세요 (기존: ${cat.icon}):`, cat.icon);
    if (newIcon && newIcon.trim()) cat.icon = newIcon.trim();
    saveCategoriesData();
    renderSidebar();
    renderCurrentProject();
    showToast(`분류가 '${cat.name}'(으)로 수정되었습니다.`);

function deleteCategoryPrompt(catId) {
  if (categoriesData.length <= 1) {
    showToast("최소 1개의 분류는 유지되어야 합니다.");
    return;
  }
  const cat = categoriesData.find(c => c.id === catId);
  if (!cat) return;

  const itemsInCat = projectsData.filter(p => p.category === catId);
  if (itemsInCat.length > 0) {
    const targetCat = categoriesData.find(c => c.id !== catId) || categoriesData[0];
    const confirmDel = confirm(`'${cat.name}' 분류에 ${itemsInCat.length}개의 항목이 있습니다.\n이 분류를 삭제하고 항목들을 '${targetCat.name}' 분류로 이동하시겠습니까?`);
    if (!confirmDel) return;
    itemsInCat.forEach(p => { p.category = targetCat.id; });
  } else {
    if (!confirm(`'${cat.name}' 분류를 삭제하시겠습니까?`)) return;
  }

  categoriesData = categoriesData.filter(c => c.id !== catId);
  saveCategoriesData();
  saveProjectsData();
  renderSidebar();
  renderCurrentProject();
  showToast(`'${cat.name}' 분류가 삭제되었습니다.`);
}

// ================= DRAG AND DROP STATE & LOGIC =================
let dndState = {
  dragType: null, // 'category' | 'item'
  sourceCatIndex: null,
  sourceCatId: null,
  sourceItemOrigIndex: null
};
let wasJustDragging = false;

function clearAllDropIndicators() {
  document.querySelectorAll('.cat-is-dragging, .cat-drop-above, .cat-drop-below').forEach(el => {
    el.classList.remove('cat-is-dragging', 'cat-drop-above', 'cat-drop-below');
  });
  document.querySelectorAll('.item-is-dragging, .item-drop-above, .item-drop-below').forEach(el => {
    el.classList.remove('item-is-dragging', 'item-drop-above', 'item-drop-below');
  });
  document.querySelectorAll('.list-accepts-item').forEach(el => {
    el.classList.remove('list-accepts-item');
  });
}

function resetDndState() {
  dndState.dragType = null;
  dndState.sourceCatIndex = null;
  dndState.sourceCatId = null;
  dndState.sourceItemOrigIndex = null;
  clearAllDropIndicators();
}

// 1. CATEGORY DRAG HANDLERS (큰영역)
function handleCatDragStart(e, catIdx, catId) {
  if (dndState.dragType === 'item') return;
  dndState.dragType = 'category';
  dndState.sourceCatIndex = catIdx;
  dndState.sourceCatId = catId;
  wasJustDragging = true;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'category', catIdx, catId }));

  const section = document.querySelector(`.sidebar-category-section[data-cat-id="${catId}"]`);
  if (section) section.classList.add('cat-is-dragging');
}

function handleCatDragOver(e, targetCatIdx, targetCatId) {
  if (dndState.dragType === 'category') {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const section = document.querySelector(`.sidebar-category-section[data-cat-id="${targetCatId}"]`);
    if (section) {
      const rect = section.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      section.classList.remove('cat-drop-above', 'cat-drop-below');
      if (e.clientY < midY) {
        section.classList.add('cat-drop-above');
      } else {
        section.classList.add('cat-drop-below');
      }
    }
  } else if (dndState.dragType === 'item') {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }
}

function handleCatDragLeave(e) {
  const section = e.currentTarget;
  if (section) {
    section.classList.remove('cat-drop-above', 'cat-drop-below');
  }
}

function handleCatDrop(e, targetCatIdx, targetCatId) {
  e.preventDefault();
  e.stopPropagation();
  clearAllDropIndicators();

  if (dndState.dragType === 'category') {
    const fromIdx = dndState.sourceCatIndex;
    let toIdx = targetCatIdx;
    if (fromIdx !== null && toIdx !== null && fromIdx !== toIdx) {
      const section = document.querySelector(`.sidebar-category-section[data-cat-id="${targetCatId}"]`);
      if (section) {
        const rect = section.getBoundingClientRect();
        const isBelow = (e.clientY >= rect.top + rect.height / 2);
        if (isBelow && fromIdx > toIdx) toIdx++;
        if (!isBelow && fromIdx < toIdx) toIdx--;
      }
      if (toIdx < 0) toIdx = 0;
      if (toIdx >= categoriesData.length) toIdx = categoriesData.length - 1;

      if (fromIdx !== toIdx) {
        const [movedCat] = categoriesData.splice(fromIdx, 1);
        categoriesData.splice(toIdx, 0, movedCat);
        saveCategoriesData();
        renderSidebar();
        renderCurrentProject();
        showToast(`분류 '${movedCat.name}' 순서가 변경되었습니다.`);
      }
    }
  } else if (dndState.dragType === 'item') {
    if (dndState.sourceItemOrigIndex !== null) {
      moveItemToCategoryEnd(dndState.sourceItemOrigIndex, targetCatId);
    }
  }
  resetDndState();
}

// 2. ITEM DRAG HANDLERS (작은영역 및 영역 간 이동)
function handleItemDragStart(e, origIdx, catId) {
  e.stopPropagation();
  dndState.dragType = 'item';
  dndState.sourceItemOrigIndex = origIdx;
  dndState.sourceCatId = catId;
  wasJustDragging = true;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'item', origIdx, catId }));

  const itemEl = e.currentTarget;
  if (itemEl) itemEl.classList.add('item-is-dragging');
}

function handleItemDragOver(e, targetOrigIdx, targetCatId) {
  if (dndState.dragType !== 'item') return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';

  const itemEl = e.currentTarget;
  const rect = itemEl.getBoundingClientRect();
  const midY = rect.top + rect.height / 2;
  itemEl.classList.remove('item-drop-above', 'item-drop-below');
  if (e.clientY < midY) {
    itemEl.classList.add('item-drop-above');
  } else {
    itemEl.classList.add('item-drop-below');
  }
}

function handleItemDragLeave(e) {
  e.currentTarget.classList.remove('item-drop-above', 'item-drop-below');
}

function handleItemDrop(e, targetOrigIdx, targetCatId) {
  if (dndState.dragType !== 'item') return;
  e.preventDefault();
  e.stopPropagation();
  clearAllDropIndicators();

  const fromOrigIdx = dndState.sourceItemOrigIndex;
  if (fromOrigIdx === null || targetOrigIdx === null || fromOrigIdx === targetOrigIdx) {
    resetDndState();
    return;
  }

  const rect = e.currentTarget.getBoundingClientRect();
  const isAbove = (e.clientY < rect.top + rect.height / 2);

  moveItemToPosition(fromOrigIdx, targetOrigIdx, targetCatId, isAbove);
  resetDndState();
}

function handleListDragOver(e, targetCatId) {
  if (dndState.dragType !== 'item') return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('list-accepts-item');
}

function handleListDragLeave(e) {
  e.currentTarget.classList.remove('list-accepts-item');
}

function handleListDrop(e, targetCatId) {
  if (dndState.dragType !== 'item') return;
  e.preventDefault();
  e.stopPropagation();
  clearAllDropIndicators();

  if (dndState.sourceItemOrigIndex !== null) {
    moveItemToCategoryEnd(dndState.sourceItemOrigIndex, targetCatId);
  }
  resetDndState();
}

function handleDragEnd(e) {
  clearAllDropIndicators();
  setTimeout(() => {
    wasJustDragging = false;
    resetDndState();
  }, 100);
}

// 3. MUTATION HELPERS FOR ITEMS
function moveItemToPosition(fromOrigIdx, targetOrigIdx, targetCatId, isAbove) {
  if (fromOrigIdx < 0 || fromOrigIdx >= projectsData.length) return;
  if (targetOrigIdx < 0 || targetOrigIdx >= projectsData.length) return;

  const activeProj = projectsData[currentProjIndex];
  const [draggedItem] = projectsData.splice(fromOrigIdx, 1);
  const oldCatId = draggedItem.category;
  draggedItem.category = targetCatId;

  // Calculate destination index in modified projectsData
  let adjustedTargetIdx = targetOrigIdx;
  if (fromOrigIdx < targetOrigIdx) {
    adjustedTargetIdx--;
  }
  let insertIdx = isAbove ? adjustedTargetIdx : adjustedTargetIdx + 1;
  if (insertIdx < 0) insertIdx = 0;
  if (insertIdx > projectsData.length) insertIdx = projectsData.length;

  projectsData.splice(insertIdx, 0, draggedItem);

  // Preserve active selection
  currentProjIndex = projectsData.indexOf(activeProj);
  if (currentProjIndex === -1) currentProjIndex = 0;

  saveProjectsData();
  renderSidebar();
  renderCurrentProject();

  const targetCat = categoriesData.find(c => c.id === targetCatId);
  const catName = targetCat ? targetCat.name : targetCatId;
  if (oldCatId !== targetCatId) {
    showToast(`'${draggedItem.title || '항목'}'이(가) [${catName}] 분류로 이동되었습니다.`);
  } else {
    showToast(`항목 순서가 변경되었습니다.`);
  }
}

function moveItemToCategoryEnd(fromOrigIdx, targetCatId) {
  if (fromOrigIdx < 0 || fromOrigIdx >= projectsData.length) return;

  const activeProj = projectsData[currentProjIndex];
  const [draggedItem] = projectsData.splice(fromOrigIdx, 1);
  const oldCatId = draggedItem.category;
  draggedItem.category = targetCatId;

  // Find last index of targetCatId
  let lastIndexInCat = -1;
  for (let i = 0; i < projectsData.length; i++) {
    if (projectsData[i].category === targetCatId) {
      lastIndexInCat = i;
    }
  }

  if (lastIndexInCat !== -1) {
    projectsData.splice(lastIndexInCat + 1, 0, draggedItem);
  } else {
    projectsData.push(draggedItem);
  }

  currentProjIndex = projectsData.indexOf(activeProj);
  if (currentProjIndex === -1) currentProjIndex = 0;

  saveProjectsData();
  renderSidebar();
  renderCurrentProject();

  const targetCat = categoriesData.find(c => c.id === targetCatId);
  const catName = targetCat ? targetCat.name : targetCatId;
  if (oldCatId !== targetCatId) {
    showToast(`'${draggedItem.title || '항목'}'이(가) [${catName}] 분류로 이동되었습니다.`);
  } else {
    showToast(`항목 순서가 변경되었습니다.`);
  }
}

// ================= SIDEBAR RENDERING (ALL DYNAMIC CATEGORIES & DRAG-N-DROP) =================

            <button class="btn btn-outline btn-xs" style="padding: 2px 6px; font-size: 10.5px;" onclick="addNewItem('${cat.id}')" title="${cat.name}에 새 항목 추가">+ 추가</button>

              <button class="btn btn-danger-outline btn-xs" style="padding: 2px 5px; font-size: 10px;" onclick="deleteCategoryPrompt('${cat.id}')" title="분류 삭제">🗑️</button>

function selectProject(pIdx) {
  if (wasJustDragging) return;
  if (pIdx < 0 || pIdx >= projectsData.length) return;
  currentProjIndex = pIdx;
  if (activeQuestionIndex[pIdx] === undefined) activeQuestionIndex[pIdx] = 0;
  renderSidebar();
  renderCurrentProject();
}

// ================= MAIN WORKSPACE RENDERING =================
function renderCurrentProject() {
  if (!projectsData || projectsData.length === 0) {
    document.getElementById('questionsContainer').innerHTML = '<div style="text-align:center; padding: 40px; color:#64748b;">항목이 없습니다. 좌측 + 추가 버튼을 눌러주세요.</div>';
    return;
  }

  if (currentProjIndex >= projectsData.length) currentProjIndex = 0;
  const proj = projectsData[currentProjIndex];
  if (!activeQuestionIndex[currentProjIndex]) activeQuestionIndex[currentProjIndex] = 0;

  // Category Dropdown
  const catDropdown = document.getElementById('categorySelectDropdown');
  if (catDropdown) {
    catDropdown.innerHTML = categoriesData.map((c, i) => `
      <option value="${c.id}" ${proj.category === c.id ? 'selected' : ''}>
        ${c.icon} ${i + 1}. ${c.name}
      </option>
    `).join('') + `<option value="__NEW_CATEGORY__">➕ 새 분류 만들기...</option>`;
  }

  // Top Bar inputs
  const currentCat = categoriesData.find(c => c.id === proj.category);
  document.getElementById('currentProjCode').textContent = formatCodeBadge(proj.code, currentProjIndex);
  document.getElementById('currentProjTitleInput').value = proj.title || '';

  // Tech Tags
  renderTechTags(proj);

  // Question Stepper
  renderQuestionStepper(proj);

  // Questions
  renderQuestions(proj);
}

function handleProjTitleChange(val) {
  projectsData[currentProjIndex].title = val.trim();
  renderSidebar();
  triggerAutoSave();
}

function renderTechTags(proj) {
  const bar = document.getElementById('techTagsBar');
  const tags = proj.tags || [];
  let html = `<span class="tags-label">KEYWORD TAGS:</span>`;
  tags.forEach((t, tIdx) => {
    html += `
      <span class="tech-chip">
        <span contenteditable="true" onblur="updateTechTag(${tIdx}, this.textContent)">${escapeHtml(t)}</span>
        <span class="chip-delete" onclick="deleteTechTag(${tIdx})">&times;</span>
      </span>
    `;
  });
  html += `<button class="chip-add-btn" onclick="addTechTag()">+ 태그 추가</button>`;
  bar.innerHTML = html;
}

function addTechTag() {
  const newTag = prompt("추가할 키워드/기술 태그를 입력하세요 (예: Cpk 1.67, 웜기어, Python):");
  if (newTag && newTag.trim()) {
    if (!projectsData[currentProjIndex].tags) projectsData[currentProjIndex].tags = [];
    projectsData[currentProjIndex].tags.push(newTag.trim());
    renderTechTags(projectsData[currentProjIndex]);
    triggerAutoSave();
  }
}

function updateTechTag(tIdx, val) {
  projectsData[currentProjIndex].tags[tIdx] = val.trim();
  triggerAutoSave();
}

function deleteTechTag(tIdx) {
  projectsData[currentProjIndex].tags.splice(tIdx, 1);
  renderTechTags(projectsData[currentProjIndex]);
  triggerAutoSave();
}

// ================= QUESTION STEPPER =================
function renderQuestionStepper(proj) {
  const stepper = document.getElementById('qStepperList');
  const activeQ = activeQuestionIndex[currentProjIndex] || 0;

  let html = '';
  proj.questions.forEach((q, qIdx) => {
    const isActive = (qIdx === activeQ) ? 'active' : '';
    html += `
      <button class="q-tab-btn ${isActive}" onclick="goToQuestion(${qIdx})">
        <span class="q-tab-num">Q${qIdx + 1}</span>
      </button>
    `;
  });

  html += `<button class="btn btn-outline btn-sm" style="padding: 5px 10px; font-size: 11px;" onclick="addQuestionToCurrentProject()">+ 꼬리질문</button>`;
  stepper.innerHTML = html;

  // View toggle button text
  const viewToggleBtn = document.getElementById('viewToggleBtn');
  if (viewToggleBtn) {
    viewToggleBtn.className = `view-toggle-btn ${isFocusViewMode ? 'active' : ''}`;
    viewToggleBtn.textContent = isFocusViewMode ? '🎯 1문1답 집중 뷰' : '📜 전체 질문 펼쳐보기';
  }
}

function toggleFocusView() {
  isFocusViewMode = !isFocusViewMode;
  renderQuestionStepper(projectsData[currentProjIndex]);
  renderQuestions(projectsData[currentProjIndex]);
}

// ================= QUESTIONS RENDERING (CLEAN HEADER & STAR TOGGLE) =================
function renderQuestions(proj) {
  const container = document.getElementById('questionsContainer');
  const questions = proj.questions || [];

  if (questions.length === 0) {
    container.innerHTML = `
      <div style="text-align: center; padding: 40px; background: #0c182b; border: 1px dashed #1a345c; border-radius: 12px;">
        <p style="color: #94a3b8; margin-bottom: 12px;">등록된 면접 질문이 없습니다.</p>
        <button class="btn btn-primary" onclick="addQuestionToCurrentProject()">➕ 첫 번째 질문 추가</button>
      </div>
    `;
    return;
  }

  const activeQ = activeQuestionIndex[currentProjIndex] || 0;

  let html = '';
  questions.forEach((q, qIdx) => {
    if (isFocusViewMode && qIdx !== activeQ) return;
    html += renderSingleQuestionCard(q, qIdx, questions.length);
  });

  container.innerHTML = html;
  // Auto-resize summary textareas so full text is visible at a glance
  container.querySelectorAll('.summary-lead-input').forEach(autoResizeTextarea);
}

function autoResizeTextarea(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.max(26, el.scrollHeight) + 'px';
}

// ================= NAVIGATION BETWEEN QUESTIONS =================
function goToQuestion(targetIdx) {
  const proj = projectsData[currentProjIndex];
  if (!proj || !proj.questions || targetIdx < 0 || targetIdx >= proj.questions.length) return;
  activeQuestionIndex[currentProjIndex] = targetIdx;
  renderQuestionStepper(proj);
  renderQuestions(proj);

  setTimeout(() => {
    const card = document.getElementById(`q-card-${targetIdx}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function nextQuestion() {
  const proj = projectsData[currentProjIndex];
  if (!proj || !proj.questions) return;
  const cur = activeQuestionIndex[currentProjIndex] || 0;
  if (cur < proj.questions.length - 1) {
    goToQuestion(cur + 1);
  }
}

function prevQuestion() {
  const cur = activeQuestionIndex[currentProjIndex] || 0;
  if (cur > 0) {
    goToQuestion(cur - 1);
  }
}

function updateQField(qIdx, field, val) {
  const proj = projectsData[currentProjIndex];
  if (!proj || !proj.questions || !proj.questions[qIdx]) return;
  proj.questions[qIdx][field] = val;
  triggerAutoSave();
}

function addQuestionToCurrentProject() {
  const proj = projectsData[currentProjIndex];
  if (!proj) return;
  if (!proj.questions) proj.questions = [];

  const config = getActiveCompanyConfig();
  const newQ = {
    question: `Q${proj.questions.length + 1}. 이 질문에 대한 내용을 입력하세요`,
    summary: "두괄식 핵심 요약 한 문장을 입력하세요",
    use_star: false,
    plain_kw: "핵심 연상 키워드 입력",
    plain_text: `[S] 당시 문제 상황 및 배경을 입력하세요.

[T] 달성하고자 했던 핵심 목표와 역할을 입력하세요.

[A] 문제를 해결하기 위해 적용한 공학적 액션 및 메커니즘을 입력하세요.

[R] 정량적 성과 및 직무 기여점을 입력하세요.\n\n[C] 입사 후 직무에서의 기여 방안을 입력하세요.`,
    s_kw: "문제 상황 핵심 키워드",
    s: "당시 구체적 문제 상황",
    t_kw: "달성 목표 핵심 키워드",
    t: "달성해야 했던 목표와 역할",
    a_kw: "공학 조치 핵심 키워드",
    a: "문제를 해결하기 위해 적용한 공학적 액션 및 메커니즘",
    r_kw: "정량 성과 핵심 키워드",
    r: `정량적 결과 및 ${config.shortName} 직무 기여점`
  };

  proj.questions.push(newQ);
  activeQuestionIndex[currentProjIndex] = proj.questions.length - 1;
  saveProjectsData();
  renderSidebar();
  renderQuestionStepper(proj);
  renderQuestions(proj);
  showToast("새 질문이 추가되었습니다.");

  setTimeout(() => {
    const card = document.getElementById(`q-card-${proj.questions.length - 1}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function deleteQuestion(qIdx) {
  const proj = projectsData[currentProjIndex];
  if (!proj || !proj.questions || proj.questions.length <= 1) {
    showToast("최소 1개의 질문은 유지되어야 합니다.");
    return;
  }

  if (confirm(`Q${qIdx + 1} 질문을 삭제하시겠습니까?`)) {
    proj.questions.splice(qIdx, 1);
    if (activeQuestionIndex[currentProjIndex] >= proj.questions.length) {
      activeQuestionIndex[currentProjIndex] = Math.max(0, proj.questions.length - 1);
    }
    saveProjectsData();
    renderSidebar();
    renderQuestionStepper(proj);
    renderQuestions(proj);
    showToast("질문이 삭제되었습니다.");
  }
}

// ================= PROJECT MUTATIONS (CUSTOM CATEGORIES SUPPORT) =================
function addNewItem(category = 'project') {
  const config = getActiveCompanyConfig();
  const cat = categoriesData.find(c => c.id === category) || categoriesData[0];
  const countInCat = projectsData.filter(p => p.category === cat.id).length + 1;
  const newCode = countInCat < 10 ? `0${countInCat}` : `${countInCat}`;

  const newProj = {
    id: `${cat.id.substring(0, 2).toUpperCase()}${projectsData.length + 1}`,
    category: cat.id,
    code: newCode,
    title: `신규 ${cat.name} ${countInCat}`,
    tags: (cat.id === 'career') ? ["양산 운영", "품질 관리", "수율 개선"] : ["신규 공법", "공정 데이터", "알고리즘"],
    questions: [
      {
        question: "Q1. 이 경험은 구체적으로 무엇을 한 것인가요?",
        summary: "두괄식 요약 한 문장을 입력하세요",
        use_star: false,
        plain_kw: "핵심 연상 키워드 입력",
        plain_text: `[S] 당시 문제 상황 및 배경을 입력하세요.

[T] 달성하고자 했던 핵심 목표와 역할을 입력하세요.

[A] 문제를 해결하기 위해 적용한 공학적 액션 및 메커니즘을 입력하세요.

[R] 정량적 성과 및 직무 기여점을 입력하세요.\n\n[C] 입사 후 직무에서의 기여 방안을 입력하세요.`,
        s_kw: "당시 배경 핵심 키워드",
        s: "[Situation] 당시 어떤 상황과 배경에서 문제가 발생했나요?",
        t_kw: "목표 핵심 키워드",
        t: "[Task] 본인이 맡았던 핵심 목표와 역할은 무엇이었나요?",
        a_kw: "공학 조치 핵심 키워드",
        a: "[Action] 문제를 해결하기 위해 어떤 물리적/수학적/공학적 행동과 메커니즘을 적용했나요?",
        r_kw: "정량 성과 핵심 키워드",
        r: `[Result] 정량적 성과(수율, Loss, 시간 등)와 ${config.name} 기여점은 무엇인가요?`
      }
    ]
  };

  projectsData.push(newProj);
  currentProjIndex = projectsData.length - 1;
  activeQuestionIndex[currentProjIndex] = 0;
  saveProjectsData();
  renderSidebar();
  renderCurrentProject();
  showToast(`새 ${cat.name} 항목이 추가되었습니다.`);
}

function addNewProject() {
  addNewItem('project');
}

function deleteCurrentProject() {
  deleteProjectByIndex(currentProjIndex);
}

function deleteProjectByIndex(targetIdx, event) {
  if (event) {
    event.stopPropagation();
    event.preventDefault();
  }
  if (targetIdx < 0 || targetIdx >= projectsData.length) return;
  const proj = projectsData[targetIdx];
  if (!proj) return;

  const title = proj.title || '선택한 항목';
  if (confirm(`'${title}' 항목을 삭제하시겠습니까?\n(포함된 질문 및 답변 데이터도 함께 삭제됩니다)`)) {
    projectsData.splice(targetIdx, 1);
    
    // Adjust currentProjIndex if deleted item affects active index
    if (currentProjIndex >= projectsData.length) {
      currentProjIndex = Math.max(0, projectsData.length - 1);
    } else if (currentProjIndex > targetIdx) {
      currentProjIndex--;
    }
    
    if (projectsData.length > 0 && !activeQuestionIndex[currentProjIndex]) {
      activeQuestionIndex[currentProjIndex] = 0;
    }
    
    saveProjectsData();
    renderSidebar();
    renderCurrentProject();
    showToast(`'${title}' 항목이 삭제되었습니다.`);
  }
}

// ================= REFERENCE VIEWER LOGIC =================
function toggleReferencePane() {
  const pane = document.getElementById('referencePane');
  if (!pane) return;
  pane.classList.toggle('collapsed');
}

function switchDocTab(docKey) {
  activeDocKey = docKey;
  const tabH = document.getElementById('tab-hyundai');
  const tabS = document.getElementById('tab-skhynix');
  if (tabH) tabH.classList.toggle('active', docKey === 'hyundai');
  if (tabS) tabS.classList.toggle('active', docKey === 'skhynix');
  renderReferenceDoc();
}

function getChunkCategory(tag) {
  const t = (tag || '').toLowerCase();
  if (t.includes('자소서') || t.includes('자기소개서')) return 'essay';
  if (t.includes('프로젝트') || t.includes('경험')) return 'project';
  return 'career';
}

function getCategoryIcon(cat) {
  if (cat === 'essay') return '✍️ [자기소개서]';
  if (cat === 'project') return '🚀 [프로젝트]';
  return '💼 [경력]';
}

function filterRefCategory(cat) {
  activeRefCategory = cat;
  document.querySelectorAll('.ref-cat-chip').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-cat') === cat);
  });
  const searchInput = document.getElementById('refSearchInput');
  renderReferenceDoc(searchInput ? searchInput.value : '');
}

function renderReferenceDoc(searchKeyword = '') {
  const container = document.getElementById('refContentArea');
  if (!container) return;
  const chunks = CONTEXT_DOCS[activeDocKey] || [];
  container.innerHTML = '';

  let matchCount = 0;
  const kw = searchKeyword.trim().toLowerCase();

  chunks.forEach((chunk, idx) => {
    const isMatch = kw === '' || chunk.text.toLowerCase().includes(kw) || (chunk.tag && chunk.tag.toLowerCase().includes(kw));
    if (!isMatch) return;

    const cat = getChunkCategory(chunk.tag);
    if (activeRefCategory !== 'all' && activeRefCategory !== cat) return;

    matchCount++;

    let displayText = escapeHtml(chunk.text);
    if (kw !== '') {
      const regex = new RegExp(`(${escapeRegex(kw)})`, 'gi');
      displayText = displayText.replace(regex, '<span class="highlight">$1</span>');
    }

    const card = document.createElement('div');
    card.className = `doc-chunk-card cat-${cat}`;
    const catBadgeText = `${getCategoryIcon(cat)} ${escapeHtml(chunk.tag)}`;
    card.innerHTML = `
      <div class="chunk-header">
        <span class="chunk-tag">${catBadgeText}</span>
        <button class="btn btn-outline btn-xs" onclick="copyChunkText(${idx})" style="padding: 2px 7px; font-size: 10.5px;">📋 복사</button>
      </div>
      <div class="chunk-text">${displayText}</div>
    `;
    container.appendChild(card);
  });

  const countEl = document.getElementById('searchCount');
  if (countEl) {
    countEl.textContent = kw ? `${matchCount}건 검색됨` : `${chunks.length}개 항목`;
  }
}

function searchRefDoc() {
  const input = document.getElementById('refSearchInput');
  renderReferenceDoc(input ? input.value : '');
}

function copyChunkText(idx) {
  const chunks = CONTEXT_DOCS[activeDocKey] || [];
  if (!chunks[idx]) return;
  copyToClipboard(chunks[idx].text);
  showToast("해당 원문이 클립보드에 복사되었습니다!");
}

function copyActiveDocAll() {
  const chunks = CONTEXT_DOCS[activeDocKey] || [];
  const fullText = chunks.map(c => `### [${c.tag}]\n${c.text}`).join('\n\n---\n\n');
  copyToClipboard(fullText);
  showToast("원문 전체가 클립보드에 복사되었습니다!");
}

// ================= EXPORT & IMPORT =================
function exportToMarkdown() {
  const config = getActiveCompanyConfig();
  let md = `# [${config.name}] ${config.title} (면접 노트)\n\n`;
  md += `> 최종 내보내기 일시: ${new Date().toLocaleString('ko-KR')}\n\n---\n\n`;

  categoriesData.forEach((cat, catIdx) => {
    const items = projectsData.filter(p => p.category === cat.id);
    if (items.length === 0) return;

    md += `# ${catIdx + 1}. ${cat.icon} ${cat.name}\n\n`;
    items.forEach((proj, pIdx) => {
      md += `## [${formatCodeBadge(proj.code, pIdx)}] ${proj.title}\n\n`;
      md += `- **Keywords**: ${(proj.tags || []).join(', ')}\n\n`;
      (proj.questions || []).forEach((q, qIdx) => {
        md += `### Q${qIdx + 1}. ${q.question}\n\n`;
        if (q.summary) md += `> ⚡ **두괄식 요약**: ${q.summary}\n\n`;
        md += `- **[S - 상황]**: ${q.s_kw || ''}\n`;
        md += `- **[T - 목표]**: ${q.t_kw || ''}\n`;
        md += `- **[A - 행동]**: ${q.a_kw || ''}\n`;
        md += `- **[R - 성과]**: ${q.r_kw || ''}\n`;
        md += `- **[C - 기여]**: ${q.c_kw || ''}\n\n`;
        md += `- 💬 **구술 답변 (줄글)**:\n${q.plain_text || ensurePlainText(q)}\n\n`;
      });
      md += `---\n\n`;
    });
  });

  downloadFile(`${config.exportPrefix}_notes.md`, md, "text/markdown;charset=utf-8;");
  showToast("Markdown 파일이 다운로드되었습니다.");
}

function exportToHTML() {
  const config = getActiveCompanyConfig();
  const currentHtml = document.documentElement.outerHTML;
  downloadFile(`${config.exportPrefix}_backup.html`, "<!DOCTYPE html>\n" + currentHtml, "text/html;charset=utf-8;");
  showToast("현재 상태의 전체 HTML이 다운로드되었습니다.");
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
  }, 100);
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(err => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-999999px";
  textArea.style.top = "-999999px";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
  } catch (err) {
    console.error('Fallback: Oops, unable to copy', err);
  }
  document.body.removeChild(textArea);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2200);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}


// ================= SECURITY AUTHENTICATION LOGIC =================
const DEFAULT_ACCESS_PASS = "1312";

function getStoredPassword() {
  return localStorage.getItem('HYUNDAI_DASH_PASS_2026') || DEFAULT_ACCESS_PASS;
}

function checkAuthStatus() {
  const isUnlocked = sessionStorage.getItem('HYUNDAI_DASH_SESSION_UNLOCKED');
  const overlay = document.getElementById('lockScreenOverlay');
  if (isUnlocked === 'true') {
    if (overlay) overlay.classList.add('hidden');
  } else {
    if (overlay) overlay.classList.remove('hidden');
    setTimeout(() => {
      const input = document.getElementById('lockInputPass');
      if (input) input.focus();
    }, 100);
  }
}

function handleLockKeyPress(e) {
  if (e.key === 'Enter') {
    submitAuthUnlock();
  }
}

function submitAuthUnlock() {
  const input = document.getElementById('lockInputPass');
  const errMsg = document.getElementById('lockErrorMsg');
  if (!input) return;

  const entered = input.value.trim();
  const validPass = getStoredPassword();

  if (entered === "1312" || entered === validPass) {
    localStorage.setItem('HYUNDAI_DASH_PASS_2026', '1312');
    sessionStorage.setItem('HYUNDAI_DASH_SESSION_UNLOCKED', 'true');
    const overlay = document.getElementById('lockScreenOverlay');
    if (overlay) overlay.classList.add('hidden');
    if (errMsg) errMsg.textContent = '';
    input.value = '';
    showToast('🔓 보안 인증 성공! 워크스페이스가 열렸습니다.');
  } else {
    if (errMsg) errMsg.textContent = '비밀번호가 올바르지 않습니다. (기본: 1312)';
    input.classList.add('shake');
    setTimeout(() => {
      input.classList.remove('shake');
    }, 400);
    input.select();
  }
}

function lockDashboardNow() {
  sessionStorage.removeItem('HYUNDAI_DASH_SESSION_UNLOCKED');
  const overlay = document.getElementById('lockScreenOverlay');
  if (overlay) overlay.classList.remove('hidden');
  const input = document.getElementById('lockInputPass');
  if (input) {
    input.value = '';
    input.focus();
  }
  showToast('🔒 대시보드가 잠겼습니다.');
}

function changePasswordPrompt() {
  const currentPass = getStoredPassword();
  const inputOld = prompt('현재 비밀번호를 입력해주세요:');
  if (inputOld === null) return;

  if (inputOld !== currentPass && inputOld !== "1312") {
    alert('현재 비밀번호가 일치하지 않습니다.');
    return;
  }

  const newPass = prompt('새로 설정할 비밀번호를 입력해주세요:');
  if (!newPass || !newPass.trim()) {
    alert('비밀번호를 공백으로 설정할 수 없습니다.');
    return;
  }

  localStorage.setItem('HYUNDAI_DASH_PASS_2026', newPass.trim());
  alert('비밀번호가 성공적으로 변경되었습니다!');
  showToast('🔑 새 비밀번호가 저장되었습니다.');
}
